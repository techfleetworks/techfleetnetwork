name: Mutation testing (product code)

# Mutation testing for product code — the audit (2026-10) found the repo mutation-tests its CI
# GUARDS (verify-guard-test-discrimination) but never its APPLICATION code, so a product test could
# assert nothing and still pass. This runs StrykerJS over the configured target (stryker.conf.json —
# currently src/lib/security.ts) and FAILS when the mutation score drops below `thresholds.break`
# (ratcheted upward with each climb batch; see stryker.conf.json for the current floor).
#
# ALWAYS-REPORT PATTERN (so the `stryker` check can be a REQUIRED status check without deadlocking):
# a path-filtered workflow only posts its check on PRs that match the filter, so making it required
# would leave every unrelated PR waiting forever for a status that never arrives. Instead this job runs
# on EVERY PR but first checks whether the diff actually touches the mutated target; if not, it skips
# the (slow) campaign and reports success in seconds. The heavy run only happens when it is relevant,
# yet the `stryker` check always reports — so it is safe to require in branch protection.
on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 7 * * MON"
  workflow_dispatch:

concurrency:
  group: mutation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  stryker:
    runs-on: ubuntu-latest
    # 45 (not 30): the dry run may take up to dryRunTimeoutMinutes (15) to boot the full suite, so the
    # campaign needs headroom beyond that within the job budget.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # Full history so the merge-base with the target branch is available to diff against.
          fetch-depth: 0
      - name: Is the mutated target in scope for this run?
        id: scope
        # Run the campaign only when the diff touches the mutated code or the gate's own
        # config/workflow — this list MUST stay in sync with `mutate` in stryker.conf.json (expand both
        # in lockstep when the target grows). On schedule / manual dispatch there is no base ref, so
        # always run the full campaign. base_ref via env, never inline, to avoid script injection.
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -z "$BASE_REF" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Scheduled / manual run — running the full mutation campaign."
            exit 0
          fi
          git fetch --no-tags origin "$BASE_REF"
          base=$(git merge-base HEAD "origin/$BASE_REF")
          # Include D so deleting/renaming-away the mutated target still triggers the (failing) run,
          # surfacing the config/target mismatch rather than silently reporting a pass.
          changed=$(git diff --name-only --diff-filter=ACMRD "$base" HEAD)
          # here-string, not `printf | grep -q`: `grep -q` closes the pipe on first match and, under
          # the default `pipefail` shell, a SIGPIPE on the writer could flip the pipeline to non-zero
          # and misread an in-scope diff as out-of-scope (a false pass).
          if grep -qxE 'src/lib/security\.ts|stryker\.conf\.json|\.github/workflows/mutation\.yml' <<<"$changed"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Diff touches the mutated target — running the mutation campaign."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Diff does not touch src/lib/security.ts (or the gate config) — skipping the campaign, reporting pass."
          fi
      - name: Setup Node
        if: steps.scope.outputs.run == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        if: steps.scope.outputs.run == 'true'
        run: npm ci
      - name: Run Stryker mutation testing
        if: steps.scope.outputs.run == 'true'
        run: npm run test:mutation
      - name: Upload mutation report
        if: always() && steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mutation-report
          path: reports/mutation/
          retention-days: 14
          if-no-files-found: ignore
