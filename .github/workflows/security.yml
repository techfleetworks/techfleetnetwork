name: Security

# Consolidated security scan: dependency-advisory gate + secret detection.
# Runs on PRs and weekly to catch new advisories in unchanged code.
# Dependency-review (supply-chain diff) lives in ci.yml (PR-only).
#
# BOTH jobs are hard gates:
#  - dependency-advisories fails on any npm-audit advisory not covered by an
#    unexpired entry in security-advisories.waivers.json.
#  - secret-scan fails on any committed secret.
# CodeQL (SAST) is a separate required workflow (.github/workflows/codeql.yml).

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # dependency-advisories — BLOCKING. Fails on ANY advisory (npm audit) that is
  # not covered by an unexpired entry in security-advisories.waivers.json. The
  # waiver file is the only bypass (dated + expiring), so a no-upstream-fix
  # advisory like quill's cannot silently un-gate the whole check.
  # ---------------------------------------------------------------------------
  dependency-advisories:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc

      - name: Enforce dependency-advisory gate (waiver-aware, hard fail)
        run: npm run check:dependency-advisories

      - name: Capture full audit report
        if: always()
        run: npm audit --json > npm-audit.json 2>/dev/null || true

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: npm-audit-report
          path: npm-audit.json
          retention-days: 30

  # ---------------------------------------------------------------------------
  # secret-scan — block committed secrets. This one IS a hard fail.
  # ---------------------------------------------------------------------------
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc

      - name: Cache node_modules
        id: cache-modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            node_modules
            ~/.npm
          key: ${{ runner.os }}-node-v2-${{ hashFiles('package.json', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-v2-

      - name: Install dependencies (cache miss)
        if: steps.cache-modules.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Block committed env files and private secrets
        run: npm run scan:secrets
